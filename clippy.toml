# Environment variable names that appear in argh help text, where literal backticks would leak.
# The trailing ".." keeps clippy's built-in defaults.
doc-valid-idents = ["SUDO_ASKPASS", "ASKPASS_RELAY_SOCKET", ".."]

# Code complexity. Complexity and length keep clippy's defaults, written out so a reader sees
# what the gate holds a function to. `excessive_nesting` reports nothing until a threshold is
# set: 6 leaves a dispatch loop (an async task, a loop, a match on the next item) its natural
# shape and reports a branch buried inside it.
cognitive-complexity-threshold = 25
too-many-lines-threshold = 100
excessive-nesting-threshold = 6

# Tests may unwrap: a failed test is the report.
allow-unwrap-in-tests = true

# A struct literal lists its fields in the order the struct defines them.
check-inconsistent-struct-field-initializers = true

# A comment does not stop collapsing an `if`; the fix keeps the comment.
lint-commented-code = true

# A leading underscore means unused, so no field named that way is visible outside its type.
pub-underscore-fields-behavior = "AllPubFields"

# A test may print what it inspects with dbg!.
allow-dbg-in-tests = true

# Tests build on the minimum supported Rust version too, so they use nothing newer.
check-incompatible-msrv-in-tests = true

# An acronym in a name is one capitalized word: `HttpClient`, not `HTTPClient`.
upper-case-acronyms-aggressive = true
